<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI DOM Tutor Settings</title>
  <style>
    :root {
      --bg-primary:   #1a1a1a;
      --bg-secondary: #2d2d2d;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent:  #3b82f6;
      --success: #10b981;
      --danger:  #ef4444;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      min-height: 520px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    .container { padding: 20px; }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--bg-secondary);
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .subtitle { color: var(--text-secondary); font-size: 13px; }

    /* ── Tabs ── */
    .tab-container {
      display: flex;
      margin-bottom: 16px;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 4px;
      gap: 2px;
    }
    .tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,0.05); }

    /* ── Section Card ── */
    .section {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── Form ── */
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    label.inline { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-primary); }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #404040;
      border-radius: 8px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    input[type="range"] { padding: 4px 0; accent-color: var(--accent); }
    input[type="color"]  { padding: 3px; height: 40px; cursor: pointer; }
    input[type="checkbox"] { width: auto; accent-color: var(--accent); cursor: pointer; }

    .rate-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Buttons ── */
    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent);  color: #fff; }
    .btn-success { background: var(--success); color: #fff; }

    /* ── Language list ── */
    .language-list, .provider-list { display: flex; flex-direction: column; gap: 8px; }

    .language-item, .provider-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-primary);
      border-radius: 8px;
      gap: 8px;
    }

    .language-info, .provider-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .language-code {
      background: var(--accent);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .badge-rtl {
      background: #764ba2;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      flex-shrink: 0;
    }
    .badge-default {
      background: var(--success);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      flex-shrink: 0;
    }

    .actions { display: flex; gap: 4px; flex-shrink: 0; }

    .icon-btn {
      padding: 6px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .icon-btn--danger:hover { color: var(--danger); }

    /* ── Provider list ── */
    .provider-info { flex-direction: row; align-items: center; gap: 10px; flex: 1; }
    .provider-info > div:first-child { min-width: 110px; }
    .provider-model { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .api-key-input { font-family: monospace; letter-spacing: 0.08em; flex: 1; font-size: 13px; }

    .test-btn {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .test-btn:hover { opacity: 0.85; }

    /* ── Status ── */
    .status {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
    }
    .status.success { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .status.error   { background: rgba(239,68,68,0.15);  color: var(--danger);  border: 1px solid rgba(239,68,68,0.3); }
    .status.warning { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }

    .hidden { display: none !important; }

    /* ── Add language row ── */
    .add-lang-row { display: flex; gap: 8px; align-items: flex-end; }
    .add-lang-row input:first-child { flex: 0 0 70px; }
    .add-lang-row input:nth-child(2) { flex: 1; }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="logo">🧠 AI DOM Tutor</div>
      <div class="subtitle">Multilingual Web Assistance</div>
    </header>

    <nav class="tab-container" role="tablist">
      <div class="tab active" data-tab="languages" role="tab" aria-selected="true"  tabindex="0">🌐 Languages</div>
      <div class="tab"        data-tab="providers"  role="tab" aria-selected="false" tabindex="0">🤖 Providers</div>
      <div class="tab"        data-tab="settings"   role="tab" aria-selected="false" tabindex="0">⚙️ Settings</div>
    </nav>

    <!-- ── LANGUAGES TAB ── -->
    <div id="languages-tab" class="tab-content" role="tabpanel">
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
          </svg>
          Manage Languages
        </div>

        <div class="form-group">
          <label>Add New Language</label>
          <div class="add-lang-row">
            <input type="text" id="new-lang-code"  placeholder="Code (e.g. pt)" maxlength="8" aria-label="Language code">
            <input type="text" id="new-lang-label" placeholder="Label (e.g. Portuguese)" aria-label="Language label">
            <button class="btn btn-primary" id="add-language-btn">Add</button>
          </div>
        </div>

        <div class="language-list" id="languages-list" aria-label="Configured languages">
          <!-- populated by popup.ts -->
        </div>
      </div>
    </div>

    <!-- ── PROVIDERS TAB ── -->
    <div id="providers-tab" class="tab-content hidden" role="tabpanel">
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.22C21 6.73 16.74 3 12 3c-4.69 0-9 3.65-9 9.28-.6.34-1 .98-1 1.72v2c0 1.1.9 2 2 2h1v-6.1c0-3.87 3.13-7 7-7s7 3.13 7 7V19h-8v2h8c1.1 0 2-.9 2-2v-1.22c.59-.31 1-.92 1-1.64v-2.3c0-.7-.41-1.31-1-1.62z"/>
          </svg>
          AI Provider Configuration
        </div>

        <div class="form-group">
          <label for="active-provider">Active Provider</label>
          <select id="active-provider" aria-label="Select active AI provider">
            <option value="openai">OpenAI (GPT-3.5-turbo)</option>
            <option value="gemini">Google Gemini Pro</option>
            <option value="claude">Anthropic Claude 3</option>
            <option value="groq">Groq (Llama3-70b)</option>
          </select>
        </div>

        <div class="provider-list" id="providers-list" aria-label="AI providers">
          <!-- populated by popup.ts -->
        </div>

        <div class="form-group" style="margin-top:14px;">
          <label>Test Active Provider</label>
          <div id="test-result" class="status hidden" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <!-- ── SETTINGS TAB ── -->
    <div id="settings-tab" class="tab-content hidden" role="tabpanel">
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          Extension Settings
        </div>

        <div class="form-group">
          <label for="speech-rate">Speech Rate</label>
          <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1"
                 aria-label="Speech rate" aria-valuemin="0.5" aria-valuemax="2">
          <div class="rate-labels">
            <span>Slow (0.5×)</span>
            <strong id="speech-rate-value" aria-live="polite">1</strong>
            <span>Fast (2×)</span>
          </div>
        </div>

        <div class="form-group">
          <label for="highlight-color">Element Highlight Color</label>
          <input type="color" id="highlight-color" value="#3b82f6" aria-label="Highlight color">
        </div>

        <div class="form-group">
          <label class="inline">
            <input type="checkbox" id="auto-activate">
            Auto-activate tutoring on page load
          </label>
        </div>

        <div class="form-group">
          <label class="inline">
            <input type="checkbox" id="voice-guidance" checked>
            Enable voice guidance (text-to-speech)
          </label>
        </div>

        <button class="btn btn-primary" id="save-settings-btn" style="width:100%; justify-content:center; margin-top:4px;">
          Save Settings
        </button>
      </div>
    </div>

  </div><!-- /.container -->

  <script src="popup.js" type="module"></script>
</body>
</html>
